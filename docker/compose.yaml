name: template-app-next

services:
  mailpit:
    image: axllent/mailpit:v1.29.7
    ports:
      - ${EMAIL_SMTP_PORT:?}:1025
      - 8025:8025

  typesense:
    image: typesense/typesense:30.2
    command: --data-dir /data --api-key ${TYPESENSE_ADMIN_API_KEY:?}
    ports:
      - 8108:8108
    volumes:
      - typesense:/data

volumes:
  typesense:
