name: Build image
description: Build the Docker image, and push it to the GitHub container registry.

inputs:
  dotenv-file:
    description: File with the public and build-time environment variables.
    required: true
  github-token:
    description: Token with permission to write packages.
    required: true

outputs:
  image:
    description: Image reference with the digest.
    value: ${{ steps.config.outputs.name }}@${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - id: config
      shell: bash
      env:
        DOTENV_FILE: ${{ inputs.dotenv-file }}
      run: |
        # image tags are exact versions or `canary`, so a range is resolved to the newest matching release.
        bun_version="$(jq -r '.devEngines.runtime.version' package.json)"
        [ "$bun_version" = canary ] || bun_version="$(bun pm view "bun@$bun_version" version)"
        hash="$(sha256sum "$DOTENV_FILE" | cut -d " " -f 1)"
        {
          echo "bun-version=$bun_version"
          echo "dotenv-hash=$hash"
          echo "deployment-id=$GITHUB_SHA-${hash:0:12}"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}"
        } >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        # environments build different images of the same commit, so the commit is not a unique tag.
        tags: ${{ steps.config.outputs.name }}:${{ steps.config.outputs.deployment-id }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        secret-files: dotenv=${{ inputs.dotenv-file }}
        build-args: |
          BUN_VERSION=${{ steps.config.outputs.bun-version }}
          DOTENV_HASH=${{ steps.config.outputs.dotenv-hash }}
          NEXT_DEPLOYMENT_ID=${{ steps.config.outputs.deployment-id }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
