name: Setup
description: Install Bun and project dependencies.

runs:
  using: composite
  steps:
    # `setup-bun` does not read `devEngines`. It resolves ranges to the newest matching release.
    - id: config
      shell: bash
      run: echo "bun-version=$(jq -r '.devEngines.runtime.version' package.json)" >> "$GITHUB_OUTPUT"

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.config.outputs.bun-version }}

    - shell: bash
      run: bun install --frozen-lockfile
