name: Deploy
description: >-
  Render the Helm chart, apply it with kubectl, roll back when the app does not become ready, delete removed resources,
  and check the public url.

inputs:
  env-file:
    description: Json file with the environment variables of the container.
    required: true
  helm-version:
    description: Version of Helm, which only renders the chart.
    default: v4.3.0
  image:
    description: Image reference with a digest.
    required: true
  kube-config:
    description: Base64-encoded kubeconfig.
    required: true
  values-file:
    description: Json file with the values of the chart, see `chart/values.schema.json`.
    required: true

runs:
  using: composite
  steps:
    - uses: azure/setup-helm@v4
      with:
        version: ${{ inputs.helm-version }}

    - shell: bash
      env:
        ENV_FILE: ${{ inputs.env-file }}
        IMAGE: ${{ inputs.image }}
        KUBE_CONFIG: ${{ inputs.kube-config }}
        VALUES_FILE: ${{ inputs.values-file }}
      run: '"$GITHUB_ACTION_PATH/deploy.sh"'
