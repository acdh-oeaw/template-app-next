{{- /* a Gateway, because cert-manager then gets a certificate for each host without help from the cluster admins. */}}
{{- $tls := .Values.ingress.tls }}
{{- $hosts := dig "redirectHosts" (list) $tls }}
{{- if $hosts }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.name }}-redirects
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $tls.certIssuer }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    {{- range $hosts }}
    {{- $id := replace "." "-" . }}
    - name: http-{{ $id }}
      hostname: {{ . }}
      port: {{ $.Values.gateway.ports.http }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-{{ $id }}
      hostname: {{ . }}
      port: {{ $.Values.gateway.ports.https }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $.Values.name }}-{{ $id }}-tls
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}-redirects
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  hostnames:
    {{- toYaml $hosts | nindent 4 }}
  parentRefs:
    {{- range $hosts }}
    {{- $id := replace "." "-" . }}
    - name: {{ $.Values.name }}-redirects
      sectionName: http-{{ $id }}
    - name: {{ $.Values.name }}-redirects
      sectionName: https-{{ $id }}
    {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ include "app.host" . }}
            statusCode: 301
{{- end }}
