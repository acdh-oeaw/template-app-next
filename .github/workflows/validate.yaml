name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Update visual snapshots and upload them as a workflow artifact
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # `runs-on` cannot read `env`, so it uses this value through the yaml anchor.
  RUNNER_IMAGE: &runner-image ubuntu-26.04

jobs:
  check:
    name: Lint, format and type check
    runs-on: *runner-image
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - parallel:
          - run: bun run format:check
          - run: bun run lint:check
          - run: bun run styles:check
          - run: bun run types:check

  config:
    name: Read configuration
    runs-on: *runner-image
    timeout-minutes: 5
    outputs:
      playwright-version: ${{ steps.config.outputs.playwright-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - id: config
        run: echo "playwright-version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

  e2e:
    name: End-to-end tests
    needs: [config]
    runs-on: *runner-image
    timeout-minutes: 30
    # The image pins browsers, system dependencies and fonts, so visual snapshots do not change with runner image updates
    # and can be reproduced locally with `bun run test:e2e:docker`. `container.image` is evaluated before any step runs,
    # so the version is read in a separate job. Keep in sync with `scripts/e2e-docker.ts`.
    # @see {@link https://playwright.dev/docs/ci#via-containers}
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.config.outputs.playwright-version }}-resolute
      # The runner user, which owns the checked-out workspace.
      options: --user 1001
    env:
      # `bun run env:sync` does not create `.env.local` in CI.
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ env.RUNNER_IMAGE }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ env.RUNNER_IMAGE }}-${{ hashFiles('bun.lock') }}-

      - run: bun run test:e2e ${{ inputs.update-snapshots && '--update-snapshots=changed' || '' }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && inputs.update-snapshots }}
        with:
          name: snapshots
          path: e2e/snapshots/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
