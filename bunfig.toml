#:schema https://www.schemastore.org/bunfig.json

[fmt]
config = "./configs/oxfmt.config.ts"
# Generated, served as they are, or Helm templates, which are not yaml. In the oxfmt config, patterns can only match
# files inside `configs/`.
ignorePatterns = [".github/actions/deploy/chart/templates/", "e2e/snapshots/", "public/"]

[lint]
config = "./configs/oxlint.config.ts"

[run]
bun = true

[test]
pathIgnorePatterns = ["e2e/**"]
